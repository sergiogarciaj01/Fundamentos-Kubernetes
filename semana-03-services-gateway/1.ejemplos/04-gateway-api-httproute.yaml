# ==============================================================================
# EJEMPLO 04: Enrutamiento Moderno con Gateway API (Gateway + HTTPRoute)
# Analogía: Puerta Principal (Gateway) y Recepcionista (HTTPRoute) que dirige
#           /cafe al servicio de menú y /cocina al servicio de cocina.
# Nota: Requiere tener instalados los CRDs de Gateway API y Cilium habilitado
#       como controlador de Gateway API (gatewayClassName: cilium).
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kubecafe-gateway
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubecafe-rutas
spec:
  parentRefs:
    - name: kubecafe-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /cocina
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: cocina-svc
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /menu
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: menu-nodeport-svc
          port: 80
