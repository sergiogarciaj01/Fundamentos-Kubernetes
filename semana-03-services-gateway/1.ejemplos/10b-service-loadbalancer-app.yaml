apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecafe-lb-app
  labels:
    app: kubecafe-lb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubecafe-lb
  template:
    metadata:
      labels:
        app: kubecafe-lb
    spec:
      containers:
        - name: web
          image: nginx:alpine
          command:
            - sh
            - -c
            - |
              cat <<EOF > /usr/share/nginx/html/index.html
              <!DOCTYPE html>
              <html lang="es">
              <head>
                <meta charset="UTF-8" />
                <title>KubeCafé LoadBalancer</title>
              </head>
              <body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070B14;color:#F8FAFC;font-family:system-ui,sans-serif;">
                <div style="background:#0F172A;border:1px solid #06B6D4;border-radius:16px;padding:2rem 2.5rem;max-width:520px;text-align:center;box-shadow:0 0 30px rgba(6,182,212,0.2);">
                  <div style="font-size:2.5rem;margin-bottom:0.5rem;">⚖️☕</div>
                  <h1 style="margin:0;font-size:1.4rem;color:#22D3EE;">KubeCafé · LoadBalancer (Cilium L2)</h1>
                  <p style="color:#94A3B8;font-size:0.95rem;margin:0.75rem 0 1.25rem;">Tráfico enrutado directamente a través de Cilium LB IPAM</p>
                  <div style="background:#020617;border:1px solid #1E293B;border-radius:10px;padding:0.9rem;font-family:monospace;font-size:1rem;color:#34D399;">
                    Pod que responde: <b>$HOSTNAME</b>
                  </div>
                  <button onclick="location.reload()" style="margin-top:1.25rem;padding:0.65rem 1.2rem;border:none;border-radius:8px;background:#06B6D4;color:#020617;font-weight:700;cursor:pointer;">
                    🔄 Recargar para probar balanceo
                  </button>
                </div>
              </body>
              </html>
              EOF
              exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: kubecafe-lb-svc
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: kubecafe-lb
  ports:
    - name: http
      port: 80
      targetPort: 80
