apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubecafe-por-header
spec:
  parentRefs:
    - name: kubecafe-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /beta
          headers:
            - name: X-Env
              value: beta
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: menu-nodeport-svc
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /beta
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: cocina-svc
          port: 80
