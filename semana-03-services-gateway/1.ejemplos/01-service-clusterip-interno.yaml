# ==============================================================================
# EJEMPLO 01: Service ClusterIP (Comunicación Interna en KubeCafé)
# Analogía: El Mesero interno que atiende pedidos entre cocina y barra.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecafe-cocina
  labels:
    app: kubecafe-cocina
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubecafe-cocina
  template:
    metadata:
      labels:
        app: kubecafe-cocina
    spec:
      containers:
        - name: cocina
          image: nginx:alpine
          command:
            - sh
            - -c
            - |
              cat <<EOF > /usr/share/nginx/html/index.html
              <!DOCTYPE html>
              <html lang="es">
              <head><meta charset="UTF-8" /><title>Cocina KubeCafé</title></head>
              <body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070B14;color:#F8FAFC;font-family:system-ui,sans-serif;">
                <div style="background:#0F172A;border:1px solid #38BDF8;border-radius:16px;padding:2rem;text-align:center;max-width:480px;">
                  <div style="font-size:2.4rem;">☕</div>
                  <h1 style="margin:0.5rem 0;font-size:1.3rem;color:#38BDF8;">Cocina KubeCafé (ClusterIP)</h1>
                  <div style="background:#020617;border-radius:8px;padding:0.8rem;font-family:monospace;color:#34D399;">Pod: <b>$HOSTNAME</b></div>
                </div>
              </body>
              </html>
              EOF
              exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cocina-svc
  labels:
    app: kubecafe-cocina
spec:
  # ClusterIP: IP virtual estable SOLO accesible dentro del clúster
  type: ClusterIP
  selector:
    app: kubecafe-cocina
  ports:
    - name: http
      protocol: TCP
      port: 80        # Puerto que expone el Service dentro del clúster
      targetPort: 80  # Puerto real donde escucha el contenedor
