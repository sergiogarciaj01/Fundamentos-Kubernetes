apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubecafe-canary-peso
spec:
  parentRefs:
    - name: kubecafe-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /peso
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: cocina-svc
          port: 80
          weight: 80
        - name: menu-nodeport-svc
          port: 80
          weight: 20
