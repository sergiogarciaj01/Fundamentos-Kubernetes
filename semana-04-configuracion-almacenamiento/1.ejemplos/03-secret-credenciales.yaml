# 🔐 Lab 3: Secret para Credenciales Sensibles (Opaque)
# Analogía KubeCafé: La receta secreta y la clave de la caja fuerte guardadas aparte.
apiVersion: v1
kind: Secret
metadata:
  name: kubecafe-receta-secreta
type: Opaque
stringData:
  DB_USER: "barista_admin"
  DB_PASS: "TintoSeguro2026!"
  API_KEY: "kc-live-987654321"
---
apiVersion: v1
kind: Pod
metadata:
  name: caja-fuerte-pod
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Usuario DB: $DB_USER"
          echo "Archivo secreto montado en /etc/kubecafe/API_KEY:"
          cat /etc/kubecafe/API_KEY
          echo ""
          sleep 3600
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: kubecafe-receta-secreta
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: kubecafe-receta-secreta
              key: DB_PASS
      volumeMounts:
        - name: secreto-vol
          mountPath: /etc/kubecafe
          readOnly: true
  volumes:
    - name: secreto-vol
      secret:
        secretName: kubecafe-receta-secreta
