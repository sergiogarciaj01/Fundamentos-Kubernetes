# 🚨 RETO 1 (Nivel Fácil): El Pod que no encuentra su ropa 🚨
# Síntoma: Al hacer 'kubectl get pods', el estado se queda en ErrImagePull o ImagePullBackOff.
# Pista: Usa 'kubectl describe pod reto-01-imagen' y lee la sección final llamada "Events".

apiVersion: v1
kind: Pod
metadata:
  name: reto-01-imagen
  labels:
    reto: "1"
spec:
  containers:
    - name: servidor-web
      image: nginx:1.30-alpine # la imagen no existe, lo que genera un error ImagePullBackOff / ErrImagePull. se camnio la imagen a nginx:1.30-alpine
      ports:
        - containerPort: 80 # el puerto debe estar entre 1 y 65535. hay que arreglar esto para poder crear el pod.
        # se cambio el puerto al 80 para que coincida con el puerto por donde escucha la aplicacion.