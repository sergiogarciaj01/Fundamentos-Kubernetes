# 🚨 RETO 4 (Nivel Ninja): El Manifiesto con Indentación Rota y apiVersion Incompatible 🚨
# Síntoma: Al hacer 'kubectl apply', la terminal muestra:
#          "error: error parsing 04-deployment-yaml-identacion.yaml: error converting YAML to JSON"
#          o indica que el recurso no es reconocido en ese apiVersion.
#
# Pista: Revisa con lupa dos cosas:
#        1. Para un Deployment, el apiVersion estándar en Kubernetes es 'apps/v1' (no 'v1').
#        2. La sangría (indentación con espacios) de YAML es estricta: 'template:' debe estar dentro
#           de 'spec:', y 'containers:' debe estar dentro de 'template.spec:'.
# Misión: Arregla la estructura y la indentación de espacios para que el Deployment se aplique limpiamente.

# apiVersion: v1 # ❌ Error: Los Deployments pertenecen al grupo 'apps/v1'
# kind: Deployment 
# metadata:
#   name: reto-04-estructura
# spec:
#   replicas: 2
#   selector:
#     matchLabels:
#       app: pagos
# template: # ❌ Error de indentación: 'template' debe estar indentado dentro de 'spec',  define la plantilla del Pod que va a administrar el Deployment
#   metadata:
#     labels:
#       app: pagos
#   spec:
# containers: # ❌ Error de indentación: 'containers' debe estar dentro de 'template.spec', containers define los contenedores que componen el Pod
#   - name: servicio-pagos
#     image: nginx:alpine
#     ports:
#       - containerPort: 80
# # Los Pods simples pertenecen a apiVersion: v1, pero los controladores de cargas de trabajo (como Deployment, StatefulSet y DaemonSet) pertenecen al grupo de API apps/v1. Si pones solo v1, el API Server rechaza la definición porque no encuentra la especificación de un Deployment en ese grupo.


apiVersion: apps/v1 #se corrige apiVersion a apps/v1, los Deployments pertenecen al grupo 'apps/v1'
kind: Deployment
metadata:
  name: reto-04-estructura
  labels:
    reto: "4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pagos
  template: # se corrige indentación, ahora template está dentro de spec, sirve para definir la plantilla del Pod que va a administrar el Deployment
    metadata:
      labels:
        app: pagos
    spec:
      containers: # se corrige identación, ahora containers está dentro de template.spec, sirve para definir los contenedores que componen el Pod
        - name: servicio-pagos
          image: nginx:alpine
          ports:
            - containerPort: 80