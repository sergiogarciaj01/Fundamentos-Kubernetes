# 🚨 RETO 1 (Nivel Fácil): El Pod que no encuentra su ropa 🚨
# Síntoma: Al hacer 'kubectl get pods', el estado se queda en ErrImagePull o ImagePullBackOff.
# Pista: Usa 'kubectl describe pod reto-01-imagen' y lee la sección final llamada "Events".

apiVersion: v1
kind: Pod
metadata:
  name: reto-01-imagen
  labels:
    reto: "1"
spec:
  containers:
    - name: servidor-web
      image: nginx:alpine
      ports:
        - containerPort: 80

# RETO 01
# Erro: Numero de puerto invalido. Solucion: cambiar el puerto por el 80
# Error: ImagePullBackOff, despues de usar el comando kubectl describe pod reto-01-imagen,
# arrojo el mensaje failed to pull and unpack image, porque la imagen nginx:version-fantasma-999 no existe
# Solucion: cambiar la imagen por nginx:alpine